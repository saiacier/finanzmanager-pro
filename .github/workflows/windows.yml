# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the Windows package on a Windows runner (PyInstaller cannot build for another system).
# Same steps as on a Windows PC (README): tests, build.py with license allowlist and self-test.
name: Windows-Paket
on:
  workflow_dispatch:
  push:
    branches: ['build/windows']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Bauumgebung
        run: |
          python -m venv work\build-env
          work\build-env\Scripts\python -m pip install --disable-pip-version-check -r scripts\requirements-windows.txt
          # Installer tool only; keeps it out of the analysed program (license allowlist).
          work\build-env\Scripts\python -m pip uninstall -y --disable-pip-version-check setuptools
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Tests
        run: work\build-env\Scripts\python -m unittest discover -s tests
      - name: Paket und Installer bauen, Selbsttest und Testinstallation
        shell: pwsh
        run: |
          work\build-env\Scripts\python scripts\build.py *> build.log
          $code = $LASTEXITCODE
          Get-Content build.log -Tail 80
          if ($code -ne 0) {
            # Failure reason as a public annotation (job logs need admin rights to download).
            $tail = (Get-Content build.log -Tail 30) -join '%0A'
            Write-Output "::error title=Paketbau fehlgeschlagen::$tail"
            exit $code
          }
      - uses: actions/upload-artifact@v5
        with:
          name: FinanzManager-Windows
          path: |
            releases/FinanzManager-Pro-*-Windows.zip
            releases/FinanzManager-Pro-*-Windows-Setup.exe
            releases/verification-Windows.json
          if-no-files-found: error
          retention-days: 30
