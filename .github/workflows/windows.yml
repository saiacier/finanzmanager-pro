# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the Windows package on a Windows runner (PyInstaller cannot build for another system).
# Same steps as on a Windows PC (README): tests, build.py with license allowlist and self-test.
name: Windows-Paket
on:
  workflow_dispatch:
  push:
    branches: ['build/windows']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bauumgebung
        run: |
          python -m venv work\build-env
          work\build-env\Scripts\python -m pip install --disable-pip-version-check -r scripts\requirements-windows.txt
      - name: Tests
        run: work\build-env\Scripts\python -m unittest discover -s tests
      - name: Paket bauen und Selbsttest
        run: work\build-env\Scripts\python scripts\build.py
      - uses: actions/upload-artifact@v4
        with:
          name: FinanzManager-Windows
          path: |
            releases/FinanzManager-Pro-*-Windows.zip
            releases/verification-Windows.json
          if-no-files-found: error
          retention-days: 30
